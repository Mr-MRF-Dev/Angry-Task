<div id="dashboard" class="flex h-screen flex-col">
  <header
    class="border-surface-200 dark:border-surface-700 dark:bg-surface-900 flex items-center justify-between border-b bg-white px-4 py-3 shadow-sm"
  >
    <p class="text-xl font-bold">Angry Task</p>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="border-surface-300 text-surface-700 hover:bg-surface-100 dark:border-surface-600 dark:bg-surface-800 dark:text-surface-100 dark:hover:bg-surface-700 rounded-lg border bg-white p-2 transition"
        (click)="toggleTheme()"
        aria-label="Toggle theme"
      >
        <i [class]="toggleThemeIcon"></i>
      </button>
    </div>
  </header>

  <!-- Render Children Elements -->
  <div class="h-3/4 grow">
    <router-outlet />
  </div>
</div>
